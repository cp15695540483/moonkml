name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  # js 后端需要 Node；写在一处，三个 job 共用同一版本。
  NODE_VERSION: "24"

jobs:
  # 门禁跑一次，后面的 job 都依赖它：格式、类型、构建不过就不必铺开测试。
  gate:
    name: 门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 安装 MoonBit
        uses: ./.github/actions/moonbit
      - run: moon fmt --check
      - run: moon check --target wasm-gc --deny-warn
      - run: moon build --target wasm-gc

  # 三后端并行。坐标是 Double，wasm-gc 与 js 的格式化不是同一份实现，
  # native 又走另一条路径，所以三个后端都要单独跑一遍。
  test:
    name: 测试 / ${{ matrix.target }}
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: 安装 MoonBit
        uses: ./.github/actions/moonbit
      - name: 测试 ${{ matrix.target }}
        run: moon test --target ${{ matrix.target }}

  # KML 领域验证：普通 MoonBit 项目不需要这些，但格式库必须盯
  # 跨后端输出一致与往返守恒，否则坐标精度会被悄悄改坏。
  domain:
    name: 领域验证
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: 安装 MoonBit
        uses: ./.github/actions/moonbit

      - name: 跨后端输出一致性与往返守恒
        run: python3 tools/roundtrip_check.py

      - name: 与独立实现 simplekml 对拍
        run: |
          python3 -m pip install --quiet simplekml
          python3 tools/gen_oracle.py
          out=$(moon run cmd/main --target wasm-gc -- examples/oracle.kmz --summary)
          echo "$out"
          echo "$out" | grep -qx "document: OracleDoc"
          echo "$out" | grep -qx "placemarks: 2"
          echo "$out" | grep -qx "P1 -> point 116.3975, 39.9087"
          echo "$out" | grep -qx "L1 -> line 3 vertices"

      - name: 坏数据必须被校验拦下且退出码为 1
        run: |
          set +e
          out=$(moon run cmd/main --target wasm-gc -- examples/negative/broken.kml --validate)
          code=$?
          echo "$out"
          test $code -eq 1
          echo "$out" | grep -q "^ISSUE"
          echo "$out" | grep -q "首尾点不闭合"

      - name: 四种输入与四种输出两两可达
        run: |
          moon run cmd/main --target wasm-gc -- examples/oracle.kml --kml | grep -q "<kml "
          moon run cmd/main --target wasm-gc -- examples/oracle.kmz --geojson > /tmp/out.geojson
          python3 -c "import json;d=json.load(open('/tmp/out.geojson'));assert d['type']=='FeatureCollection';assert len(d['features'])==2"
          moon run cmd/main --target wasm-gc -- examples/sample.gpx --gpx | grep -q "<gpx "
          moon run cmd/main --target wasm-gc -- examples/sample.geojson --kml | grep -q "<Placemark>"

  bench:
    name: 基准
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 安装 MoonBit
        uses: ./.github/actions/moonbit
      - run: moon bench benchmarks --target wasm-gc --release
