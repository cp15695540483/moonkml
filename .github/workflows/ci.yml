name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  check-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Node（js 后端测试需要）
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 安装 MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: MoonBit 版本
        run: moon version

      - name: 更新注册表索引
        run: moon update

      - name: 格式检查
        run: moon fmt --check

      - name: 检查（警告即失败）
        run: moon check --target wasm-gc --deny-warn

      - name: 构建
        run: moon build --target wasm-gc

      - name: 单元测试（wasm-gc）
        run: moon test --target wasm-gc

      - name: 单元测试（js）
        run: moon test --target js

      - name: 安装 Python 对拍工具
        run: python3 -m pip install --quiet simplekml

      - name: 用 simplekml 生成独立实现的 KML/KMZ
        run: python3 tools/gen_oracle.py

      - name: 端到端：解析第三方 KML 与 KMZ
        run: |
          moon run cmd/main --target wasm-gc -- examples/oracle.kml --summary
          moon run cmd/main --target wasm-gc -- examples/oracle.kmz --summary

      - name: 端到端：GeoJSON / GPX 导出非空
        run: |
          moon run cmd/main --target wasm-gc -- examples/oracle.kml --geojson | grep -q '"type":"FeatureCollection"'
          moon run cmd/main --target wasm-gc -- examples/oracle.kml --gpx | grep -q '<gpx'
